name: KVM end-to-end

# Full install in QEMU/KVM with Secure Boot + emulated TPM, then forge-validate.
# GitHub-hosted Linux runners expose /dev/kvm. Runs nightly and on demand.
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [vm-dev, baseline]
        default: vm-dev
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PROFILE: ${{ inputs.profile || 'vm-dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install QEMU / OVMF / swtpm
        run: tests/kvm/install-deps.sh

      - name: Cache base ISO
        uses: actions/cache@v4
        with:
          path: build/cache
          key: base-iso-${{ hashFiles('build/forge.env') }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test ISO (serial console enabled)
        run: |
          ssh-keygen -t ed25519 -N '' -f build/test-key -q
          export FORGE_ADMIN_SSH_KEY="$(cat build/test-key.pub)"
          export FORGE_KERNEL_ARGS="console=ttyS0,115200n8 console=tty0"
          docker pull "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/forge-os-builder:noble" || make builder
          make iso BUILDER_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/forge-os-builder"

      - name: Run end-to-end install + validation
        run: tests/kvm/run-iso.sh build/out/forge-os-*-${PROFILE}-amd64.iso --ssh-key build/test-key --timeout 3600

      - name: Upload logs and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvm-e2e-${{ env.PROFILE }}
          path: |
            build/test-kvm/*.log
            build/test-kvm/validation-report.*
