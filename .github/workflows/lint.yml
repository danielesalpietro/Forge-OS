name: Lint

on:
  push:
    branches: [main, develop, "claude/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck / yamllint / ansible-lint / autoinstall schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint gettext-base python3-yaml python3-jsonschema
          pipx install ansible-lint
          pipx inject ansible-lint ansible-core

      - name: Install Ansible collections (for ansible-lint / syntax check)
        run: ansible-galaxy collection install -r ansible/requirements.yml
        env:
          ANSIBLE_GALAXY_COLLECTION_PATH: ~/.ansible/collections

      - name: Lint
        run: make lint
