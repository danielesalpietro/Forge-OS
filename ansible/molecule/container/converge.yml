---
- name: Converge (container-safe roles)
  hosts: all
  become: true
  pre_tasks:
    - name: Install python + apt prerequisites
      ansible.builtin.raw: apt-get update && apt-get install -y python3 python3-apt
      changed_when: false
  roles:
    - forge_base
    - forge_kernel_sysctl
    - forge_ssh
    - forge_sudo
    - forge_unattended_upgrades
    - forge_mfa
