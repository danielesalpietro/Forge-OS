---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    install_recommends: false

- name: Forge-OS jail configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.d/forge.local
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: not forge_container_mode | default(false)
