---
- name: Install auditd
  ansible.builtin.apt:
    name: [auditd, audispd-plugins]
    state: present

- name: Configure auditd.conf (retention, disk-full behaviour)
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    mode: "0640"
  notify: Restart auditd

- name: Forge-OS audit rules
  ansible.builtin.template:
    src: forge.rules.j2
    dest: /etc/audit/rules.d/50-forge.rules
    mode: "0640"
  notify: Restart auditd

- name: Immutable rule set (requires reboot to change rules)
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/99-finalize.rules
    mode: "0640"
    content: |
      # Managed by Forge-OS: lock the audit configuration
      -e 2
  when: forge_audit_immutable | bool
  notify: Restart auditd

- name: Remove immutable marker when disabled
  ansible.builtin.file:
    path: /etc/audit/rules.d/99-finalize.rules
    state: absent
  when: not forge_audit_immutable | bool

- name: Ensure auditd is enabled
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started
  when: not forge_container_mode | default(false)
