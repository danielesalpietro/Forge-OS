---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: [unattended-upgrades, apt-listchanges, needrestart]
    state: present

- name: Enable periodic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";

- name: Unattended-upgrades policy (security + ESM only)
  ansible.builtin.template:
    src: 52forge-unattended.j2
    dest: /etc/apt/apt.conf.d/52forge-unattended
    mode: "0644"

- name: Configure needrestart automatic mode
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/forge.conf
    mode: "0644"
    content: |
      $nrconf{restart} = 'a';
      $nrconf{kernelhints} = -1;

- name: Timers enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop: [apt-daily.timer, apt-daily-upgrade.timer]
  when: not forge_container_mode | default(false)
