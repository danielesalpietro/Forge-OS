---
# Third-party content vendored into the ISO at build time
# (build/scripts/25-vendor-ansible-deps.sh) so first boot works offline.
collections:
  - name: ansible.posix
    version: ">=1.5.4"
  - name: community.general
    version: ">=8.0.0"
  - name: community.crypto
    version: ">=2.16.0"
  - name: ansible.utils
    version: ">=4.0.0"

roles:
  # CIS Ubuntu 24.04 benchmark remediation (Level 1/2 server). Pin to a tag
  # once validated in KVM (Phase 1.3); 'main' is used while bootstrapping.
  - name: ubuntu24_cis
    src: https://github.com/ansible-lockdown/UBUNTU24-CIS.git
    scm: git
    version: main
